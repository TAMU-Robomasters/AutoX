[project]
name = "AutoX"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"

dependencies = [
    "iceoryx2>=0.8.1",
    "numpy==2.*",
    "opencv-python>=4.5,<5",
    "quik-config>=1.9.1",
    "super-map>=1.3.3",
    "torch>=2.10.0",
]

[dependency-groups]
dev = [
    # docs gen
    "myst-parser>=4.0.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-book-theme>=1.1.4",
    "ty>=0.0.14",
]

[tool.ruff.lint]
extend-select = [
  "D",   # pydocstyle
  "I", # sort imports
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.analysis]
# Suppress errors for all jetson packages
allowed-unresolved-imports = ["pyrealsense2.**"]
