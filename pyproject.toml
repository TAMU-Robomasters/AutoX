[project]
name = "AutoX"
version = "0.1.0a0"
description = "A framework for ARC to make running and managing multiple processes easier"
readme = "README.md"
requires-python = "==3.10.*"

dependencies = [
    "iceoryx2>=0.8.1",
    "numpy==2.*",
    "opencv-python>=4.5,<5",
    "quik-config>=1.9.1",
    "super-map>=1.3.3",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    # docs gen
    "myst-parser>=4.0.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-book-theme>=1.1.4",
]
gpu = [
    "cupy==13.6.*",
]

[tool.ruff.lint]
select = [
  "D",   # pydocstyle
  "I", # sort imports
]
ignore = [
    "D105", # no doc string for magic or dunder methods
    "D107", # no doc string for __init__
    "D104", # no doc string for __init__.py
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "tensorrt",
    "pycuda.*",
    "pyrealsense2",
    "ultralytics.*",
    "onnx",
    "calibrator",
    "file_system_py",
    "cfgv",
    "serial",
    "quik_config",
    "super_map",
    "iceoryx2",
    "iceoryx2.*",
]
ignore_missing_imports = true

[tool.ty.analysis]
# Suppress errors for all jetson packages
allowed-unresolved-imports = ["pyrealsense2.**"]
