# NOTE: names in parentheses are special, all other names are not!
(project):    
    # a central place for filepaths
    (path_to):
        main_folder:  ./
        project_root: ../
        main_test_video: &main_test_video ../assets/test.mp4
        icons_folder: ../assets/icons
        video_output:              ../result.do_not_sync.mp4
        # learned per-enemy-robot constants (radii / panel height delta), written
        # by the auto-aim engine on convergence; gitignored via **/*.ignore
        robot_constants:           ./local_data.ignore/robot_constants.json
        log_file:                  ../logs.ignore/autox.log
        record_video_output_color: ./subsystems/log/color_vid
        calibration_presets: ../assets/intrinsics
        # model
        datasets: ./subsystems/modeling/datasets.ignore/
        model: ./subsystems/modeling/model/yolov4-tiny-416
        yolo_to_onnx: ./subsystems/modeling/model/yolo_to_onnx.py
        tensorrt_so_file: ./subsystems/modeling/plugins/libyolo_layer.so
        autoboot_id: ../run/autoboot_id
        yolo_v8:
            settings: ./subsystems/modeling/model/yolov8/yolov8.yaml
            pytorch_model: ./subsystems/modeling/model/yolov8/011823_v8m.pt
            tensor_rt_engine: ./subsystems/modeling/model/yolov8/062223_v8m.engine
    
    # this file will be generated automatically
    (local_data): ./local_data.ignore.yaml
            # this^ is where you choose which profile(s)
            # and is where to store auth tokens and other secrets
    
    (profiles):
        (default):
            debug: true
            classical:
                cam_width: 1280
                cam_height: 720
                cam_fps: 90
                cam_exposure: 80

                # image processing
                blue_thresh: [ 200, 240 ]
                red_thresh: [ 200, 240 ]

                # light detection
                angle_diff_multiplier: 6.5
                misalignment_multiplier: 1.8
                expected_distance_multiplier: .63
                height_ratio_multiplier: 3.12

                angle_diff_thresh: 45
                misalignment_thresh: 30
                height_ratio_thresh: [ 0.43, 1.7 ]
                score_thresh: 322

                # live tuning: when true, a "pairing tuning" OpenCV window of
                # trackbars is shown so the score multipliers + valid-mask
                # thresholds above can be adjusted while the detector runs.
                # Changes are EPHEMERAL (runtime only) — copy good values back
                # into this block by hand. Leave false in production (no window,
                # zero overhead). See classical_detector/tuning.py.
                live_tuning: false

                # icon detection
                icon_adaptive_thresh: [ 101, -5 ]
                icon_tolerance: 80
                show_icon_filters: false
            
            our_team_color: 'red' # 'red' or 'blue'
            filter_team_color: true
            # Which detection backend the production engine uses:
            #   'python' -> FullStateAutoAimEngine    (ClassicalDetectorModule +
            #               shared ffmpeg CameraDriver). The fallback path.
            #   'cpp'    -> FullStateAutoAimEngineCpp  (armor_panel_cpp owns the
            #               camera; Python never opens it). Same estimator/state
            #               machine, detection runs in C++.
            vision_backend: cpp
            mode: development
            hardware:
                camera: usb_cam # "realsense" or "zed" or "usb_cam" 
                camera_has_depth: false
                camera_has_pose: false
                camera_has_acceleration: false
                camera_has_gyro: false
                flip_camera: false
                usb_cam_exposure: null  # set to an int (e.g. 300) to enable manual exposure; null = leave auto on
                                        # units are 100µs (e.g. 300 = 30ms shutter)
                lens_correction_mode: warp  # how lens distortion is handled (usb_cam only):
                                            #   "warp"      = remap the whole frame to a pinhole image (mapxy.npy)
                                            #   "unproject" = detect on the raw frame; undistort only the PnP points
                                            #                 (needs splined.cameramodel in the intrinsics dir)
                                            #   "normal"    = detect on the raw frame; feed the OPENCV12 distortion
                                            #                 straight into cv.solvePnP (needs opencv12.cameramodel)
            model:
                which_model: yolo_v8 
                hardware_acceleration: 'cpu' # one of: [ 'cpu', "gpu", "tensor_rt" ]
                minimum_confidence: 0.25 # should be a value between 0-1
                # ^ minimum conf not applied when using tensor_rt
                input_dimension: 416
            aiming:
                # Default
                color_stream_width: 848
                color_stream_height: 480
                depth_stream_width: 848
                depth_stream_height: 480
                stream_framerate: 60
                min_depth: 0.2
                max_depth: 5.0
                
                # Shooting Logic
                min_range: 0.2 # units? meters?
                max_range: 5

            videostream:
                simulation:
                    grab_method: 'next_frame' # 'next_frame', 'latest_frame', 'threaded_frame'
                    assumed_framerate: 30 # frames per second
                    input_file: *main_test_video
                    threaded_update_rate: 0.001
                
                testing:
                    record_interval: 0 # records one out of every x frames, <1 to not record
            log:
                disable_all_logging: false # kill switch: logging.disable() everywhere (perf)
                disable_print: false
                # stdlib-logging setup (src/toolbox/logger.py): one queue, the
                # orchestrator parent owns the console/file handlers.
                level: DEBUG              # root level for all autox.* loggers
                levels: {}                 # per-logger overrides, e.g. {panel_tracking: DEBUG}
                to_file: false             # also write to (path_to) log_file (rotating)
                max_file_mb: 20
                backup_count: 3
                save_frame_to_file: false
                display_live_frames: true
                save_depth: false
                estimated_framerate: 40 # based on yolov8 and recent tests. Not the worst thing if this number is wrong (even very wrong)
                save_rate: 20 # once every __ frames
            
            mock:
                enable: False    # when true, modules use @mock methods instead of @real
                hardware: []     # list of available hardware (e.g. ["jetson", "gpu"]). methods with @real(requires="X") fall back to mock if X is not listed here.

            # Full-state auto-aim engine loop + target-lock policy.
            autoaim:
                loop_hz: 300                    # rate CAP: the loop runs as fast as it can
                                                # and only sleeps to avoid exceeding this.
                target_reset_timeout_ms: 500    # lose the locked target after this long
                                                # without seeing its panels.
                target_switch_distance_ratio: 0.6  # switch off the locked robot only if a
                                                   # different robot is closer than this
                                                   # fraction of the locked distance.

            ballistic:
                gravity: 981              # cm/s^2
                projectile_velocity: 2300 # cm/s
                # z_offset is only used by the ARCHIVED engine; the live engine
                # aims at the measured panel height (aim_z) instead.
                z_offset: -32 # realsense
                # yaw_offset: -3           # degrees (horizontal offset to target)
                yaw_offset: 0 # -4  -3 # realsense
                # barrel_offset: [0.0, 0.0, 0.0]  # [bx, by, bz] barrel tip offset in metres
                barrel_offset: [0.0325, 0.150, 0.0]
             # realsense
                omega_spin_threshold: 3.0        # rad/s; above → shot timing, at/below → continuous fire
                # Single-panel solver validity gates (state 1 / 2a): outside
                # these the engine keeps aiming but holds fire (cv_state NO_TARGET).
                max_time_of_flight: 1.5   # s
                max_range: 800            # cm, horizontal
                solver_tol: 1.0e-4        # LM residual tolerance (metres)
            communication:
                timeout: 0.05
                serial_baudrate: 460800
                serial_port: "/dev/ttyTHS1"

            # MCU bridge driver (see plans/01-mcu-driver.md). One process owns the
            # UART; engines talk to it via McuClient. backend is overridden by the
            # MCU=* profiles below. ros.stack is set by the ROS=* profiles.
            mcu:
                backend: mock          # mock | serial | ros  (overridden by MCU=*)
                rpc_timeout: 0.05      # seconds an engine waits for an McuDriver reply
            ros:
                stack: none            # none | nav2  (set by ROS=*)

            # Full-state estimator backend. `method` only applies to the ARCHIVED
            # engine (the live engine is Kalman-filter-only); the rest configures
            # the live engine's online constant learning (state 1).
            estimation:
                method: kalman_filter   # particle_filter | kalman_filter (archive engine only)
                initial_radius_guess: 30  # cm, back-projection radius before radii converge
                # Convergence gates for saving learned constants (T1). NOTE: an
                # F=I KF's posterior variance floors near sqrt(Q*R) -- keep these
                # thresholds above that floor or T1 never fires; min_constant_updates
                # is the backstop against firing instantly.
                radii_var_threshold: 1.0   # cm^2, per-parity radius variance
                height_var_threshold: 1.0  # cm^2
                min_constant_updates: 20    # measurements before constants may save
                # Below these the quantity is "equal" and can't anchor parity.
                height_degenerate_cm: 3.0
                radii_degenerate_cm: 3.0
                panel_jump_reinit_cm: 24.0  # single-panel KF re-seed jump threshold
                force_reestimation: true   # ignore saved constants, redo state 1
                # Z-height KF (panel-center height). Low process noise: height is
                # ~constant, so predict ~= hold and the filter rides out flicker.
                height_kf_q: 0.5           # process-noise std (cm/s-equiv); keep small
                height_kf_r: 3.0           # measurement-noise std (cm) of the mid-height

            zed:
                resolution: "HD720"       # HD2K, HD1080, HD720, VGA, LAST
                depth_mode: "PERFORMANCE" # ULTRA, QUALITY, NEURAL, PERFORMANCE, NONE, LAST
                unit:       "METER"       # CENTIMETER, FOOT, INCH, LAST, METER, MILLIMETER
                calibration:
                    brightness:  2
                    contrast:    8
                    hue:         0
                    saturation:  8
                    sharpness:   8
                    gamma:       7
                    gain:       50
                    exposure:    3
            
            realsense_settings: null
        
        # 
        # optionals (which are combined/merged with defaults)
        #
        SENTRY:
            bot: sentry
        
        STANDARD:
            bot: standard
        
        GPU=NONE:
            model:
                hardware_acceleration: 'cpu'
        GPU=TENSOR_RT: &tensor_rt
            model:
                hardware_acceleration: "tensor_rt"
        GPU=REGULAR: &gpu
            model:
                hardware_acceleration: "gpu"
        GPU: *gpu
        TRT: *tensor_rt

        CAMERA=WEBCAM:
            hardware:
                camera: webcam
                camera_index: 0
                camera_exposure: 10
                camera_fps: 90
                camera_width: 1280
                camera_height: 720
                camera_intrinsics_path: "main_sentry_cam" # doesn't have to be actual intrinsics, just a filepath to load from that the webcam class
        
# TODO fix this after you fix threading bug      
        CAMERA=SENTRY_CAM:
            hardware:
                camera: usb_cam
                camera_index: 0
                camera_exposure: 20
                camera_fps: 90
                camera_width: 1280 # 1280
                camera_height: 720 # 720
                camera_intrinsics_path: "mrcal_1280x720"
                lens_correction_mode: normal      

        # CAMERA=SENTRY_CAM:
        #     hardware:
        #         camera: usb_cam
        #         camera_index: 4
        #         camera_exposure: 80 # 10
        #         camera_gain: 128      # color sensor gain (~0-128); raise to brighten (adds noise)
        #         camera_gamma: 500     # color sensor gamma (~100-500, default 300); LOWER = brighter shadows/icon
        #         camera_brightness: 10  # color sensor brightness offset (-64..64, default 0)
        #         camera_fps: 30
        #         camera_width: 1920 # 1280
        #         camera_height: 1080 # 720
        #         camera_intrinsics_path: "realsense_1920x1080"
        #         lens_correction_mode: normal      
    
        V8:
            model:
                which_model: yolo_v8
        

        BOARD=XAVIER:
            hardware:
                camera: usb_cam
            model:
                hardware_acceleration: "tensor_rt"
            communication:
                serial_port: "/dev/ttyTHS1"  
            log:
                save_frame_to_file: false
        BOARD=LAPTOP:
            communication:
                serial_port: null
            log:
                save_rate: 1 # every frame (1 frame per frame)
                save_frame_to_file: true

        # MCU backend selection (see plans/01-mcu-driver.md).
        MCU=MOCK:                  # laptop default: identity transform, no serial, no rclpy
            mcu:
                backend: mock
        MCU=SERIAL:                # AutoX owns /dev/ttyTHS1 directly (nav2 not running)
            mcu:
                backend: serial
        MCU=ROS:                   # nav2 owns the UART; AutoX forwards over ROS (needs ROS=NAV2)
            mcu:
                backend: ros

        # ROS stack selection.
        ROS=NONE:
            ros:
                stack: none
        ROS=NAV2:
            ros:
                stack: nav2

        # Full-state estimator backend selection (FullStateAutoAimEngine).
        ESTIMATION=PARTICLE_FILTER:    # GPU particle filter (src/subsystems/pf.py)
            estimation:
                method: particle_filter
        ESTIMATION=KALMAN_FILTER:      # CPU position+angle KF pair (src/subsystems/kf.py)
            estimation:
                method: kalman_filter

            
        CAMERA=ZED:
            hardware:
                camera: zed
                camera_has_depth: true
                camera_has_pose: true
            aiming:
                # zed stream width/height pulled from camera on initialization
                stream_framerate: 30
                min_depth: 0.3
                max_depth: 10.0
        CAMERA=REALSENSE:
            hardware:
                camera: realsense
                camera_has_depth: true
                camera_has_pose: false
                camera_has_acceleration: true
                camera_has_gyro: true
                # color stream: RealSense reads width/height/fps/exposure from here.
                # exposure is manual (auto-exposure disabled); units are 100µs.
                camera_width: 960
                camera_height: 540
                camera_fps: 60
                camera_exposure: 80
                camera_gain: 64       # color sensor gain (~0-128); raise to brighten (adds noise)
                camera_gamma: 300     # color sensor gamma (~100-500, default 300); LOWER = brighter shadows/icon
                camera_brightness: 0  # color sensor brightness offset (-64..64, default 0)
            aiming:
                # depth stream dims + valid depth range (color dims come from
                # hardware.camera_* above)
                depth_stream_width: 848
                depth_stream_height: 480
                stream_framerate: 60
                min_depth: 0.2
                max_depth: 10.0
        CAMERA=NONE:
            hardware:
                camera: null
        
        FLIP_CAMERA:
            hardware:
                flip_camera: true

        DISPLAY:
            log:
                display_live_frames: true
        
        
        SHOWTIME:
            mode: production
            log:
                disable_all_logging: true
                disable_print: false
                save_frame_to_file: false
                display_live_frames: true

        PERF:
            log:
                disable_all_logging: false
                display_live_frames: true
                save_frame_to_file: false

        LOG:
            log:
                disable_all_logging: true
                save_rate: 1 # every frame (1 frame per frame)
                save_frame_to_file: true
                save_depth: false



        BENCH:
            mode: benchmark
            stop_after: 1000 # frames
        
        WE_RED:
            our_team_color: 'red'
        WE_BLUE:
            our_team_color: 'blue'
