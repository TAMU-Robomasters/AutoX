repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 0.9.28
  hooks:
    # Update the uv lockfile
    - id: uv-lock

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.14
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: ''  # Use the sha / tag you want to point at
  hooks:
  -   id: mypy